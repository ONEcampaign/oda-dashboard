# Deltas the validation module should report as explained rather than as errors.
#
# Parity (a candidate build against a baseline snapshot) and cross-view (a view against the
# topic_page outputs) match each delta against these entries. A matched delta is reported as
# INFO "explained (<reason>)"; anything unmatched stays an ERROR, non-blocking unless --strict.
#
# Give a precise reason. Do not add an entry just to silence a delta nobody can explain.
#
# Fields:
#   view        required: "financing_view", "recipients_view", "gender_view",
#               "sectors_view" or "cross_view"
#   reason      required: why the delta is expected
#   kind        "value" (default), "missing_in_candidate" or "new_in_candidate"
#   years       optional list of ints        } a filter left out, or an empty list,
#   donors      optional list of names       } matches any value
#   indicators  optional list of names       }
#   recipients  optional list of names       }
#   max_rel     optional, "value" only: largest |relative difference| this entry explains
#
# Example:
#
# [[delta]]
# view = "financing_view"
# kind = "value"
# reason = "oda-data 3 reads PSI in grant equivalents from 2023 (DAC1 measure change)"
# years = [2023, 2024]
# indicators = ["Private sector instruments"]
# max_rel = 0.05

# --- financing_view: oda-data 3.0 migration ---------------------------------------------

# Russia (87) is in PROVIDERS, but the 2.x DAC1 data held no rows for it. 3.0 reads the
# DAC1 bulk file, which has Russia's reports for 2010-2020.
[[delta]]
view = "financing_view"
kind = "new_in_candidate"
reason = "oda-data 3.0 reads Russia (87) from the DAC1 bulk file, 2010-2020; 2.x had no Russia rows"
donors = ["Russia"]

[[delta]]
view = "financing_view"
kind = "value"
reason = "oda-data 3.0 reads Russia (87) from the DAC1 bulk file, 2010-2020; 2.x had no Russia rows"
donors = ["Russia"]
years = [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020]

[[delta]]
view = "financing_view"
kind = "new_in_candidate"
reason = "Russia (87) joins Non-DAC countries and All bilateral donors in 2010-2020: indicators only Russia reports among their members"
donors = ["Non-DAC countries", "All bilateral donors"]
years = [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020]

[[delta]]
view = "financing_view"
kind = "value"
reason = "Russia (87) joins Non-DAC countries and All bilateral donors in 2010-2020 (up to USD 1.26bn a year)"
donors = ["Non-DAC countries", "All bilateral donors"]
years = [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020]

# pydeflate 2.7 reads the current DAC1 deflators and exchange rates, which the OECD revised
# for some small donors' early years. Constant prices move by up to 0.71%; current prices
# are unchanged.
[[delta]]
view = "financing_view"
kind = "value"
reason = "pydeflate 2.7 constant-price revision (current DAC1 deflators): Hungary 1992"
donors = ["Hungary"]
years = [1992]
columns = ["value_usd_constant", "value_eur_constant", "value_gbp_constant", "value_cad_constant"]
max_rel = 0.0075

[[delta]]
view = "financing_view"
kind = "value"
reason = "pydeflate 2.7 constant-price revision (current DAC1 deflators): Qatar 1990-1994"
donors = ["Qatar"]
years = [1990, 1991, 1992, 1993, 1994]
columns = ["value_usd_constant", "value_eur_constant", "value_gbp_constant", "value_cad_constant"]
max_rel = 0.0075

[[delta]]
