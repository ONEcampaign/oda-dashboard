# Data vintage: production was built from the API before the OECD revised some figures.
# 2024 is widespread (the largest is EU Institutions to Ukraine at -607m, alongside Germany,
# Italy and Spain to Ukraine), 2022 is France only (about +1.1m in total) and 2023 Austria only (-1.3m).
[[delta]]
view = "recipients_view"
kind = "value"
reason = "data vintage: 2024 DAC2A figures revised since the 2.x API pull behind production"
years = [2024]
donors = [
  "Austria", "Belgium", "Bulgaria", "Croatia", "Czechia", "Denmark", "EU Institutions",
  "Finland", "Germany", "Hungary", "Ireland", "Italy", "Latvia", "Lithuania", "Luxembourg",
  "Malta", "Poland", "Portugal", "Romania", "Slovak Republic", "Slovenia", "Spain",
  "United States", "All bilateral donors", "DAC countries", "Non-DAC countries",
  "G7 countries", "EU27 countries", "EU27 & EU Institutions",
]
columns = [
  "value_usd_current", "value_usd_constant", "value_eur_current", "value_eur_constant",
  "value_gbp_current", "value_gbp_constant",
]
max_abs = 700000000

