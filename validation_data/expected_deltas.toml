# Seven cells where the candidate is one 100-unit step below the baseline (-101 to -107).
# Values are stored rounded to 100 units from float32 millions, and these sit on a rounding
# midpoint. Switzerland to North of Sahara 2023 is 91.21505m in the bulk file, so float32
# noise (about 8 units at that size) decides which way it rounds. The other six differ by
# the same step.
[[delta]]
view = "recipients_view"
kind = "value"
reason = "one 100-unit rounding step on float32 millions (value on a rounding midpoint)"
years = [2011, 2019, 2021, 2023]
donors = ["EU27 & EU Institutions", "Poland", "Switzerland"]
indicators = ["Bilateral"]
recipients = [
  "Angola", "Armenia", "Libya", "Philippines", "Dominican Republic", "Africa",
  "North of Sahara",
]
columns = ["value_usd_current"]
max_abs = 107
