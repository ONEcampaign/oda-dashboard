# Production values come from the oda-data 2.x API, which rounded DAC1 values to USD 0.01m;
# 3.0 reads the bulk file at full precision. Each series can then differ by up to 5,000
# units (0.005m), and Core ODA, a sum of rounded parts, by about 10,800. Systemic for every
# baseline built from the 2.x API, so these are scoped by view and column only. Converted
# columns scale that rounding by their factor (CAD constant reaches about 1.4), hence 16,000.
[[delta]]
view = "financing_view"
kind = "value"
reason = "production values come from the 2.x API, which rounded to 0.01m; 3.0 reads full precision"
columns = [
  "value_usd_current", "value_usd_constant", "value_eur_current", "value_eur_constant",
  "value_gbp_current", "value_gbp_constant", "value_cad_current", "value_cad_constant",
]
max_abs = 16000

# Donor group totals in the 2.x baseline were stored in millions as float32, so a group
# total (hundreds of billions of units) is only exact to multiples of 15,625 units, and
# each delta comes in such multiples. On top of that, a group sums its members' 0.01m
# rounding. value_usd_current stays within 50,000; the converted columns scale it by their
# factor and reach 218,750, so one cap of 330,000 (1.5x the largest) covers all seven.
# Russia's 2010-2020 rows in Non-DAC countries and All bilateral donors are explained above.
[[delta]]
view = "financing_view"
kind = "value"
reason = "baseline group totals are float32 millions (15,625-unit steps) plus 2.x 0.01m rounding of members"
donors = [
  "All bilateral donors", "DAC countries", "Non-DAC countries", "G7 countries",
  "EU27 countries", "EU27 & EU Institutions",
]
columns = ["value_usd_current"]
max_abs = 50000

[[delta]]
view = "financing_view"
kind = "value"
reason = "baseline group totals are float32 millions (15,625-unit steps) plus 2.x 0.01m rounding of members"
donors = [
  "All bilateral donors", "DAC countries", "Non-DAC countries", "G7 countries",
  "EU27 countries", "EU27 & EU Institutions",
]
columns = [
  "value_usd_constant", "value_eur_current", "value_eur_constant", "value_gbp_current",
  "value_gbp_constant", "value_cad_current", "value_cad_constant",
]
max_abs = 330000

[[delta]]
view = "financing_view"
kind = "value"
reason = "production values come from the 2.x API, which rounded to 0.01m; 3.0 reads full precision"
columns = ["pct_of_total_oda"]
max_abs = 0.0003

# --- recipients_view: oda-data 3.0 migration ---------------------------------------------
#
# The view reads DAC2A Part I from the bulk file (analysis_tools.recipients); production
# came from the 2.x API. Values match except for the causes below.

# The DAC2A bulk file classifies recipients into income groups (10045-10049) differently
# from the OECD API, so the income group totals differ in every year (UMICs up to +60% in
# 2014, LMICs down up to 18%). Accepted: the view follows the bulk file.
[[delta]]
view = "recipients_view"
kind = "value"
reason = "DAC2A bulk income groups (10045-10049) differ from the 2.x API's (accepted)"
recipients = [
  "Low Income Countries (LICs)", "Lower-Middle Income Countries (LMICs)",
  "Upper-Middle Income Countries (UMICs)", "High Income Countries (HICs)",
  "Countries not classified by the World Bank",
]

[[delta]]
view = "recipients_view"
kind = "missing_in_candidate"
reason = "DAC2A bulk income groups (10045-10049) differ from the 2.x API's (accepted)"
recipients = [
  "Low Income Countries (LICs)", "Lower-Middle Income Countries (LMICs)",
  "Upper-Middle Income Countries (UMICs)", "High Income Countries (HICs)",
  "Countries not classified by the World Bank",
]

[[delta]]
view = "recipients_view"
kind = "new_in_candidate"
reason = "DAC2A bulk income groups (10045-10049) differ from the 2.x API's (accepted)"
recipients = [
  "Low Income Countries (LICs)", "Lower-Middle Income Countries (LMICs)",
  "Upper-Middle Income Countries (UMICs)", "High Income Countries (HICs)",
  "Countries not classified by the World Bank",
]

# The LDC row is summed from country rows of resolvekit's current UN LDC members, as in the
# CRS views, instead of read as DAC2A's 10016. It leaves out aid donors report against the
# LDC total only (Saudi Arabia, 2015-2024, up to USD 3.7bn a year) and applies today's list
# to every year.
[[delta]]
view = "recipients_view"
kind = "value"
reason = "LDC row is the sum of resolvekit's current UN LDC members (snapshot); OECD's DAC2A aggregate and 2.x used the OECD list"
recipients = ["Least Developed Countries (LDCs)"]

[[delta]]
view = "recipients_view"
kind = "missing_in_candidate"
reason = "LDC row is the sum of resolvekit's current UN LDC members (snapshot); OECD's DAC2A aggregate and 2.x used the OECD list"
recipients = ["Least Developed Countries (LDCs)"]

