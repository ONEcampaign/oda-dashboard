# Deltas the validation module should report as explained rather than as errors.
#
# Parity (a candidate build against a baseline snapshot) and cross-view (a view against the
# topic_page outputs) match each delta against these entries. A matched delta is reported as
# INFO "explained (<reason>)"; anything unmatched stays an ERROR, non-blocking unless --strict.
#
# Give a precise reason. Do not add an entry just to silence a delta nobody can explain.
# Remove entries once the baseline is refreshed past the change they explain.
#
# The anomaly check (a donor's unusual latest-year change in a view's key total) reads the
# entries of kind "anomaly": a matched change is reported as INFO with the reason instead
# of a WARNING.
#
# Fields: view and reason are required. The view must be a view name or "cross_view". kind
# ("value", "missing_in_candidate", "new_in_candidate", "anomaly"), the years, donors,
# indicators, recipients and columns filters, the max_rel and max_abs bounds, and
# options.json paths are optional, but every entry needs at least one filter or bound, and
# a filter list cannot be empty. Entries that explained nothing in a run that checked their
# view are reported as expected.unused. The module docstring of
# src/data/validation/expected.py describes each field.
#
# Example:
#
# [[delta]]
# view = "financing_view"
# kind = "value"
# reason = "oda-data 3 reads PSI in grant equivalents from 2023 (DAC1 measure change)"
# years = [2023, 2024]
# indicators = ["Private sector instruments"]
# columns = ["value_usd_current"]
# max_rel = 0.05

[[delta]]
view = "financing_view"
kind = "anomaly"
reason = "US ODA fell by more than half in 2025 after the US cut foreign aid and closed USAID"
years = [2025]
donors = ["United States"]
indicators = ["Grant equivalents"]
max_rel = 0.65
