name: Deploy to GCP

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_PATH: oda-dashboard  # Change for each app
  BUCKET: data-apps-one-data

# One deploy at a time: overlapping runs would rsync to the same GCS paths. A run that
# arrives while one is in progress waits, and GitHub keeps only the newest waiting run.
concurrency:
  group: deploy-gcs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    # One absolute cache path for oda_reader (and oda_data, which follows it), so the
    # directory the bulk files are registered into is the one every script reads.
    env:
      ODA_READER_CACHE_DIR: ${{ github.workspace }}/src/data/cache/oda-reader

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'  # Adjust to your required version

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Install Node dependencies
        run: npm ci

      - name: Run tests
        run: |
          uv run ruff check src/data tests
          uv run ruff format --check src/data tests
          uv run pytest -q

      - id: date
        run: |
          echo "week=$(TZ=America/Los_Angeles date +'%Y-%U')" >> $GITHUB_OUTPUT

      # The OECD file server puts a browser challenge in front of the bulk files
      # (ONEcampaign/oda_reader#50), so CI loads browser-downloaded copies kept as assets
      # on the oecd-bulk-data release instead of downloading them. The release must carry
      # CRS.parquet, MultiSystem.zip, Table1_Data.zip (DAC1) and Table2a_Data.zip (DAC2A).
      # All four are uploaded by hand.
      # Each file is registered with its own token, the release tag plus that asset's full
      # updatedAt timestamp. oda-reader reuses a derived parquet by token, so a same-day
      # re-upload under a date-only token would serve stale data from an existing cache.
      # The same timestamps go into the Observable output cache key below.
      - name: Read OECD bulk asset versions
        id: bulk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versions=$(gh release view oecd-bulk-data --json assets --jq '[.assets[] | {(.name): .updatedAt}] | add')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "hash=$(printf '%s' "$versions" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Seed OECD bulk cache
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}
          BULK_VERSIONS: ${{ steps.bulk.outputs.versions }}
        run: |
          gh release download oecd-bulk-data --dir src/data/raw_data/oecd_bulk --clobber
          uv run python src/data/scripts/register_bulk_files.py --dir src/data/raw_data/oecd_bulk --versions "$BULK_VERSIONS"
        timeout-minutes: 30

      # Observable compiled output — keyed on script/config content and
      # the locked dependencies and the oecd-bulk-data asset timestamps, so a code, dependency
      # or source-data change forces recompilation.
      # Framework reruns a data loader whose cached output is older than the loader
      # file, and a fresh checkout gives every loader the checkout time, so in CI
      # loaders rerun even on a cache hit.
      # restore-keys includes the script hash so a stale cache from a different
      # script version is never restored (avoids serving old parquet columns).
      # npm modules (_npm) are left out so unversioned `npm:` imports resolve to
      # the current release on every deploy.
      - name: Cache Observable output
        uses: actions/cache@v4
        with:
          path: |
            src/.observablehq/cache/*
            !src/.observablehq/cache/_npm
          key: observable-${{ hashFiles('src/data/scripts/**', 'src/data/analysis_tools/**', 'src/data/config.py', 'pyproject.toml', 'uv.lock') }}-${{ steps.bulk.outputs.hash }}-${{ steps.date.outputs.week }}
          restore-keys: |
            observable-${{ hashFiles('src/data/scripts/**', 'src/data/analysis_tools/**', 'src/data/config.py', 'pyproject.toml', 'uv.lock') }}-${{ steps.bulk.outputs.hash }}-

      # Caches saved before the _npm exclusion still carry it.
      - name: Drop cached npm modules
        run: rm -rf src/.observablehq/cache/_npm

      # Resolve the four registered bulk files offline before the build, so the zip to parquet
      # conversions run once, in sequence, instead of inside parallel data loaders.
      - name: Pre-warm bulk data cache
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uv run python src/data/scripts/prewarm_cache.py
        timeout-minutes: 15

      - name: Build Observable Framework app
        run: uv run npm run build
        timeout-minutes: 240

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/650536812276/locations/global/workloadIdentityPools/github/providers/github'
          service_account: 'github-deployer@one-data-commons.iam.gserviceaccount.com'

      - name: individual-loaders
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv run python src/data/scripts/sectors_view.py
        timeout-minutes: 60

      # Checks the built views (contracts, invariants, anomalies) and compares them with
      # topic_page. A contract or invariant failure stops the deploy. Anomalies and the
      # cross-view checks do not: topic_page is regenerated by hand, so a new OECD release
      # would otherwise block deploys until someone reruns it. The report is uploaded
      # whatever the result.
      - name: Validate built data
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uv run python src/data/scripts/validate.py
        timeout-minutes: 15

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation_data/reports/
          if-no-files-found: ignore

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Each sectors release lives under sources/sectors_view/<version>/, named by its
      # content hash and never overwritten, so it is cached as immutable. The options file
      # points to the live version. It goes up after the data, so every pair it lists
      # resolves, gzipped and no-cache. The live version is read first, so the prune step
      # can keep it for pages that loaded the old options.
      - name: Upload sectors partitioned dataset
        id: sectors
        run: |
          set -euo pipefail
          sources="gs://${{ env.BUCKET }}/sources"
          options_url="${sources}/sectors_view_options.json"
          version="$(jq -er '.dataset_version' cdn_files/sectors_view_options.json)"
          if [ ! -d "cdn_files/sectors_view/${version}" ]; then
            echo "::error::cdn_files/sectors_view/${version} not found"
            exit 1
          fi

          # Prints the live dataset_version, or nothing when the options object does not
          # exist yet. Any other failure (auth, network, 5xx) returns 1, so an empty version
          # always means "first deploy". Otherwise the prune step could delete the live one.
          read_live_version() {
            local out
            if ! out="$(gsutil ls "${options_url}" 2>&1)"; then
              if grep -Eq 'matched no objects|No URLs matched' <<<"${out}"; then
                return 0
              fi
              echo "::error::cannot read ${options_url}: ${out}" >&2
              return 1
            fi
            # cp decompresses the gzip-encoded object.
            gsutil -q cp "${options_url}" "${RUNNER_TEMP}/live_options.json" || return 1
            jq -er '.dataset_version // ""' "${RUNNER_TEMP}/live_options.json" || return 1
          }
          previous="$(read_live_version)"
          echo "Live sectors version: ${previous:-none}; new: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"

          # -c compares checksums, so an unchanged version is not re-uploaded for new mtimes.
          gsutil -m -h "Cache-Control:public, max-age=31536000, immutable" \
            rsync -r -c "cdn_files/sectors_view/${version}" "${sources}/sectors_view/${version}"
          gsutil -h "Cache-Control:no-cache" cp -Z cdn_files/sectors_view_options.json "${options_url}"
          if ! gsutil stat "${options_url}" | grep -Eq 'Cache-Control:.*no-cache'; then
            echo "::error::${options_url} was not uploaded with Cache-Control no-cache"
            exit 1
          fi

      # Everything but the pages first, then the pages, so a page never points at an asset
      # that is not there yet. Pages are copied one by one with no-cache (a rsync -c pass
      # skips unchanged pages and would leave their old max-age header). Hashed assets
      # under _observablehq, _file, _npm and _import keep the bucket default.
      - name: Deploy to GCS
        run: |
          set -euo pipefail
          dest="gs://${{ env.BUCKET }}/${{ env.APP_PATH }}"
          gsutil -m rsync -r -c -x '.*\.html$' dist/ "${dest}/"
          (cd dist && find . -name '*.html' -print0) |
            while IFS= read -r -d '' page; do
              gsutil -h "Cache-Control:no-cache" cp "dist/${page#./}" "${dest}/${page#./}"
            done

      - name: Purge Cloudflare cache
        if: env.CLOUDFLARE_ZONE_ID != '' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | jq -e '.success'

      # Runs only once dist/ is up, so the new app is live before anything is removed. Keeps
      # the new version, the one the live options pointed to before this deploy (pages
      # opened before it still read that one) and the one they point to now (re-read just
      # before deleting, in case scripts/upload_sectors_partition.sh published another
      # version during the deploy). A deploy whose sectors data did not change prunes nothing,
      # so a tab opened before the last release keeps its version until the next one. If the
      # live options cannot be read, or no previous version was recorded while older versions
      # exist, nothing is deleted and the step fails. Only directories named like a version
      # (VERSION_HEX_LENGTH hex digits, src/data/analysis_tools/outputs.py) are removed. The
      # root-level donor_slug=* tree
      # from before versioning is left for old cached pages. By hand, a day or more after
      # the first versioned deploy, remove it with:
      #   gsutil -m rm -r 'gs://data-apps-one-data/sources/sectors_view/donor_slug=*'
      - name: Prune old sectors dataset versions
        env:
          VERSION: ${{ steps.sectors.outputs.version }}
          PREVIOUS: ${{ steps.sectors.outputs.previous }}
        run: |
          set -euo pipefail
          base="gs://${{ env.BUCKET }}/sources/sectors_view"
          options_url="gs://${{ env.BUCKET }}/sources/sectors_view_options.json"
          if [ -z "${VERSION}" ]; then
            echo "::error::no new sectors version from the upload step; nothing pruned"
            exit 1
          fi
          if [ "${VERSION}" = "${PREVIOUS}" ]; then
            echo "Sectors data unchanged (${VERSION}); nothing to prune"
            exit 0
          fi

          # Same rule as the upload step: empty only when the options object does not exist.
          read_live_version() {
            local out
            if ! out="$(gsutil ls "${options_url}" 2>&1)"; then
              if grep -Eq 'matched no objects|No URLs matched' <<<"${out}"; then
                return 0
              fi
              echo "::error::cannot read ${options_url}: ${out}" >&2
              return 1
            fi
            gsutil -q cp "${options_url}" "${RUNNER_TEMP}/live_options_prune.json" || return 1
            jq -er '.dataset_version // ""' "${RUNNER_TEMP}/live_options_prune.json" || return 1
          }
          if ! live="$(read_live_version)"; then
            echo "::error::cannot re-read the live sectors version; nothing pruned"
            exit 1
          fi
          echo "Keeping sectors versions: new ${VERSION}, previous ${PREVIOUS:-none}, live ${live:-none}"

          listing="$(gsutil ls -d "${base}/*/")"
          versions=()
          while IFS= read -r dir; do
            name="$(basename "${dir}")"
            if [[ "${name}" =~ ^[0-9a-f]{16}$ ]]; then
              versions+=("${name}")
            fi
          done <<<"${listing}"
          # The new version was just uploaded, so a listing without it is wrong.
          if [[ " ${versions[*]-} " != *" ${VERSION} "* ]]; then
            echo "::error::new version ${VERSION} not listed under ${base}; nothing pruned"
            exit 1
          fi

          # No live options before this deploy means a first versioned deploy, which leaves one
          # version. More than one means versions this run cannot account for.
          if [ -z "${PREVIOUS}" ] && { [ -z "${live}" ] || [ "${live}" = "${VERSION}" ]; } \
            && [ "${#versions[@]}" -gt 1 ]; then
            echo "::error::no previous version recorded but ${#versions[@]} versions exist; nothing pruned"
            exit 1
          fi

          for name in "${versions[@]}"; do
            if [ "${name}" = "${VERSION}" ] || [ "${name}" = "${PREVIOUS}" ] || [ "${name}" = "${live}" ]; then
              continue
            fi
            echo "Removing sectors version ${name}"
            gsutil -m -q rm -r "${base}/${name}"
          done
