name: Deploy to GCP

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_PATH: oda-dashboard  # Change for each app
  BUCKET: data-apps-one-data

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    # One absolute cache path for oda_reader (and oda_data, which follows it), so the
    # directory the bulk files are registered into is the one every script reads.
    env:
      ODA_READER_CACHE_DIR: ${{ github.workspace }}/src/data/cache/oda-reader

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'  # Adjust to your required version
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Python dependencies
        run: uv sync

      - name: Install Node dependencies
        run: npm ci

      - name: Run tests
        run: |
          uv run ruff check src/data tests
          uv run ruff format --check src/data tests
          uv run pytest -q

      - id: date
        run: |
          echo "week=$(TZ=America/Los_Angeles date +'%Y-%U')" >> $GITHUB_OUTPUT

      # The OECD file server puts a browser challenge in front of the bulk files
      # (ONEcampaign/oda_reader#50), so CI loads browser-downloaded copies kept as assets
      # on the oecd-bulk-data release instead of downloading them. The release must carry
      # CRS.parquet, MultiSystem.zip, Table1_Data.zip (DAC1) and Table2a_Data.zip (DAC2A).
      # All four are uploaded by hand.
      # Each file is registered with its own token, the release tag plus that asset's full
      # updatedAt timestamp. oda-reader reuses a derived parquet by token, so a same-day
      # re-upload under a date-only token would serve stale data from an existing cache.
      - name: Seed OECD bulk cache
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          gh release download oecd-bulk-data --dir src/data/raw_data/oecd_bulk --clobber
          versions=$(gh release view oecd-bulk-data --json assets --jq '[.assets[] | {(.name): .updatedAt}] | add')
          uv run python src/data/scripts/register_bulk_files.py --dir src/data/raw_data/oecd_bulk --versions "$versions"
        timeout-minutes: 30

      # Observable compiled output — keyed on script/config content and
      # the locked dependencies, so a code or dependency change forces recompilation.
      # Framework reruns a data loader whose cached output is older than the loader
      # file, and a fresh checkout gives every loader the checkout time, so in CI
      # loaders rerun even on a cache hit.
      # restore-keys includes the script hash so a stale cache from a different
      # script version is never restored (avoids serving old parquet columns).
      # npm modules (_npm) are left out so unversioned `npm:` imports resolve to
      # the current release on every deploy.
      - name: Cache Observable output
        uses: actions/cache@v4
        with:
          path: |
            src/.observablehq/cache/*
            !src/.observablehq/cache/_npm
          key: observable-${{ hashFiles('src/data/scripts/**', 'src/data/analysis_tools/**', 'src/data/config.py', 'pyproject.toml', 'uv.lock') }}-${{ steps.date.outputs.week }}
          restore-keys: |
            observable-${{ hashFiles('src/data/scripts/**', 'src/data/analysis_tools/**', 'src/data/config.py', 'pyproject.toml', 'uv.lock') }}-

      # Caches saved before the _npm exclusion still carry it.
      - name: Drop cached npm modules
        run: rm -rf src/.observablehq/cache/_npm

      # Resolve the four registered bulk files offline before the build, so the zip to parquet
      # conversions run once, in sequence, instead of inside parallel data loaders.
      - name: Pre-warm bulk data cache
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uv run python src/data/scripts/prewarm_cache.py
        timeout-minutes: 15

      - name: Build Observable Framework app
        run: uv run npm run build
        timeout-minutes: 240

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/650536812276/locations/global/workloadIdentityPools/github/providers/github'
          service_account: 'github-deployer@one-data-commons.iam.gserviceaccount.com'

      - name: individual-loaders
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv run python src/data/scripts/sectors_view.py
        timeout-minutes: 60

      # Checks the built views (contracts, invariants, anomalies) and compares them with
      # topic_page. A contract or invariant failure stops the deploy. Anomalies and the
      # cross-view checks do not: topic_page is regenerated by hand, so a new OECD release
      # would otherwise block deploys until someone reruns it. The report is uploaded
      # whatever the result.
      - name: Validate built data
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uv run python src/data/scripts/validate.py
        timeout-minutes: 15

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation_data/reports/
          if-no-files-found: ignore

      - name: Cache gcloud SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.config/gcloud
            ~/.cache/google-cloud-sdk
          key: ${{ runner.os }}-gcloud-${{ hashFiles('**/*.yml') }}
          restore-keys: |
            ${{ runner.os }}-gcloud-

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload sectors partitioned dataset
        run: |
          if [ -d "cdn_files/sectors_view" ]; then
            echo "Uploading sectors partitioned dataset to GCS..."
            gsutil -m rsync -r -d cdn_files/sectors_view gs://${{ env.BUCKET }}/sources/sectors_view
            # Upload after the dataset so every slug it lists already resolves. no-cache makes
            # browsers pick up a new release's options at once.
            gsutil -h "Cache-Control:no-cache" cp cdn_files/sectors_view_options.json gs://${{ env.BUCKET }}/sources/sectors_view_options.json
          else
            echo "Warning: cdn_files/sectors_view directory not found"
            exit 1
          fi

      - name: Deploy to GCS
        run: |
          gsutil -m rsync -r -c dist/ gs://${{ env.BUCKET }}/${{ env.APP_PATH }}/

      - name: Purge Cloudflare cache
        if: env.CLOUDFLARE_ZONE_ID != '' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
