name: CI

on:
  pull_request:
    branches: [main, 'feat/**', 'chore/**']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python dependencies
        run: uv sync

      - name: Lint and test
        run: |
          uv run ruff check src/data tests
          uv run ruff format --check src/data tests
          uv run pytest -q
