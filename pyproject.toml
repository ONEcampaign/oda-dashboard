[project]
name = "oda-dashboard"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4.0",
    "oda-data==3.0.1",
    "oda-reader==1.15.0",
    # pandas 3 changes the string dtypes, and oda-data 3 would otherwise resolve it.
    "pandas>=2.3.2,<3",
    "pandas-stubs~=2.3.3",
    "pyarrow>=17.0.0",
    "pydeflate==2.7.0",
    # 1.3.2 fixed the CachedResponse round-trip that failed on Python 3.13.
    "requests-cache>=1.3.2",
    "resolvekit==0.1.13",
]

[dependency-groups]
dev = [
    "pandas-stubs>=2.3.3.251201",
    "pytest>=8.0.0",
    "ruff>=0.14.8",
]

[tool.ruff.lint]
# Sorted imports, explicit Optional, and %-style logging (the project logger is config.logger).
extend-select = ["I", "RUF013", "G004"]
logger-objects = ["src.data.config.logger"]
