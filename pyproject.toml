[project]
name = "oda-dashboard"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "oda-data==2.8.1",
    "oda-reader==1.11.2",
    "pandas>=2.3.2",
    "pandas-stubs~=2.3.3",
    "pyarrow>=17.0.0",
    "pydeflate>=2.4.0",
    "resolvekit==0.1.13",
]

[dependency-groups]
dev = [
    "pandas-stubs>=2.3.3.251201",
    "pytest>=8.0.0",
    "ruff>=0.14.8",
]

[tool.ruff.lint]
# Sorted imports, explicit Optional, and %-style logging (the project logger is config.logger).
extend-select = ["I", "RUF013", "G004"]
logger-objects = ["src.data.config.logger"]
